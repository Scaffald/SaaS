name: QA builds (iOS simulator + Android APK)

# Builds the `qa` profile (apps/scaffald/eas.json) for both platforms: Release
# builds pointed at dev, no dev client, so they run without Metro. The iOS
# build is a simulator .app (iPhone and iPad simulators); Android is an .apk.
#
# Started by .github/workflows/qa-builds.yml on each app-v* release tag, which
# waits for this run and attaches both files to the GitHub release. Run by hand
# with `eas workflow:run .eas/workflows/qa-builds.yml --ref <sha>`. Always pass
# --ref: a cloud clone is the only path that hydrates the packages/ui and
# packages/sdk submodules (see production-ios.yml).

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS simulator (qa)
    type: build
    params:
      platform: ios
      profile: qa

  build_android:
    name: Build Android APK (qa)
    type: build
    params:
      platform: android
      profile: qa
