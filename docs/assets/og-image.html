<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #034550;
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    color: #fff;
  }
  /* soft radial wash so the flat teal doesn't read as a solid block */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 500px at 88% -10%, rgba(63,181,199,0.28), transparent 62%),
      radial-gradient(700px 420px at -8% 108%, rgba(29,114,130,0.42), transparent 60%);

  .layer { position: relative; z-index: 1; }
  .wordmark { font-size: 34px; font-weight: 700; letter-spacing: -0.4px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(63,181,199,0.42);
    background: rgba(29,114,130,0.32);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 19px; font-weight: 500; color: #bde9f0;
    margin-bottom: 30px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3fb5c7; }
  h1 {
    font-size: 74px; line-height: 1.06; font-weight: 700;
    letter-spacing: -1.8px; max-width: 960px;
  }
  .sub {
    margin-top: 26px; font-size: 27px; line-height: 1.45;
    color: #7fd1de; max-width: 800px; font-weight: 400;
  }
  .trades {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    font-size: 19px; color: #7fd1de; font-weight: 500;
    border-top: 1px solid rgba(255,255,255,0.13);
    padding-top: 26px;
  }
  .sep { color: #1d7282; }
</style>
