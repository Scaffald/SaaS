name: 'Install'
description: 'Install and pre-build'

runs:
  using: composite
  steps:
    - name: Setup Node.js 18.x
      uses: actions/setup-node@v4
      with:
        cache: 'pnpm'
        node-version: 18.x

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.0.0

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
