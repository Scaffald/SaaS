name: Contract Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect contract-related changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            contracts:
              - 'tests/reports/contracts/**'
              - 'vitest.contracts.config.ts'
              - '.github/workflows/contracts.yml'
              - 'packages/ui/src/components/address/providers/**'
              - 'packages/supabase/functions/trpc/routers/resume.router.ts'
              - 'packages/supabase/functions/trpc/routers/personality-assessment.router.ts'
              - 'packages/supabase/functions/trpc/routers/stripe-settings.router.ts'
              - 'packages/supabase/functions/trpc/routers/addresses.router.ts'
              - 'packages/supabase/functions/trpc/routers/payments.router.ts'
              - 'packages/supabase/functions/send-team-invitation/**'

  contract-tests:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract suite
        run: pnpm test:contracts

      - name: Upload generated contracts
        uses: actions/upload-artifact@v7
        with:
          name: generated-contracts
          path: tests/reports/contracts/generated
          if-no-files-found: error
