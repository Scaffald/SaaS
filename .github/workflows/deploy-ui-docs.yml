name: Deploy UI Documentation

on:
  push:
    branches: [main]
    paths:
      - 'packages/scaffald-ui/docs-site/**'
      - 'packages/scaffald-ui/src/**'
      - '.github/workflows/deploy-ui-docs.yml'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Docusaurus dependencies
        run: |
          cd packages/scaffald-ui/docs-site
          npm install

      - name: Build Docusaurus site
        run: |
          cd packages/scaffald-ui/docs-site
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.SCAFFALD_UI_SYNC_TOKEN }}
          publish_dir: ./packages/scaffald-ui/docs-site/build
          external_repository: Scaffald/ui
          publish_branch: gh-pages
          user_name: 'Scaffald CI'
          user_email: 'dev@scaffald.com'
          cname: ui.scaffald.com
