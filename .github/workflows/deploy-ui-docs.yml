name: Deploy UI Documentation

on:
  push:
    branches: [main]
    paths:
      - 'packages/scaffald-ui/docs-site/**'
      - 'packages/scaffald-ui/src/**'
      - '.github/workflows/deploy-ui-docs.yml'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Docusaurus dependencies
        run: |
          cd packages/scaffald-ui/docs-site
          npm install

      - name: Build Docusaurus site
        run: |
          cd packages/scaffald-ui/docs-site
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync packages/scaffald-ui/docs-site/build/ s3://ui-scaffald-com-docs --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3LR29JN2CLH5S \
            --paths "/*"
