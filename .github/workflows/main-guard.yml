name: Main Guard

# Backstop for direct pushes to main.
#
# The pre-push hook in .githooks/ is the first line of defence, but it is only a
# deterrent: `--no-verify` skips it, it does not exist in a clone that never ran
# `pnpm install`, and it cannot see a commit made through the GitHub web UI.
# This job runs server-side and notices what the hook missed.
#
# It is detective, not preventive — the commit has already landed by the time
# this runs. The preventive version is .github/rulesets/main.json, which needs a
# GitHub plan that supports rulesets on private repos. Delete this workflow once
# that ruleset is applied and enforcing.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: main-guard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Landed via pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # `scripts/release.sh` pushes `chore(release): scaffald-app x.y.z` straight to
    # main by design — see docs/agents/RELEASE-PROCESS.md. This skips those so a
    # release commit does not trip the guard. (It also covered semantic-release,
    # which was retired along with .releaserc.json.)
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')

    steps:
      - name: Check the commit belongs to a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          SHORT="${SHA:0:8}"

          # Two independent ways to establish that a commit arrived through a
          # PR. Both are needed, and the order matters.
          #
          # 1. `pulls/{n}` records the commit a merge produced as
          #    `merge_commit_sha` — for a squash merge that is the squashed
          #    commit itself. It is written as part of the merge, so it is
          #    never stale. Requiring it to equal this SHA is what makes the
          #    trailing `(#n)` in the message safe to read: a direct push can
          #    end its subject with any number, but only the genuine merge
          #    commit of PR n matches.
          #
          # 2. `commits/{sha}/pulls` asks the reverse question. It is the more
          #    general check — it catches a merge whose message carries no PR
          #    number — but it reads an index that is eventually consistent,
          #    and this workflow starts seconds after the merge.
          #
          # That lag is not hypothetical. #747 was filed against ac49dbd0 three
          # seconds after PR #746 merged it: the endpoint answered `[]` then and
          # answers `#746` now. An empty list on the first read means "not
          # indexed yet" at least as often as it means "pushed directly", so it
          # is polled rather than believed, and only after (1) has declined to
          # answer — which keeps the ordinary squash-merge path instant and
          # spends the waiting only on commits that really do look unattached.

          merge_commit_of_referenced_pr() {
            local num merged
            num=$(printf '%s' "$MESSAGE" | head -1 \
              | sed -n 's/.*(#\([0-9][0-9]*\))[[:space:]]*$/\1/p')
            [ -n "$num" ] || return 1

            merged=$(gh api "repos/$REPO/pulls/$num" \
              --jq 'select(.merged_at != null) | .merge_commit_sha' 2>/dev/null) || return 1
            [ "$merged" = "$SHA" ] || return 1

            echo "   PR #$num records $SHORT as its merge commit."
          }

          indexed_against_a_merged_pr() {
            local count
            for delay in 0 5 10 20 30; do
              if [ "$delay" -gt 0 ]; then
                echo "   not indexed yet; waiting ${delay}s"
                sleep "$delay"
              fi

              count=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null) || count=0

              [ "${count:-0}" -gt 0 ] && return 0
            done
            return 1
          }

          if merge_commit_of_referenced_pr; then
            echo "✅ $SHORT landed via a merged pull request."
            exit 0
          fi

          if indexed_against_a_merged_pr; then
            echo "✅ $SHORT landed via a merged pull request."
            exit 0
          fi

          echo "::error::$SHORT was pushed directly to main by @$ACTOR — no merged PR."

          # Don't stack duplicates if the same commit is somehow re-reported.
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "$SHORT in:title" --json number --jq 'length')

          if [ "$EXISTING" -eq 0 ]; then
            BODY=$(printf '%s\n' \
              "\`$SHA\` landed on \`main\` without a merged pull request." \
              "" \
              "| | |" \
              "|---|---|" \
              "| **Author** | @$ACTOR |" \
              "| **Commit** | [\`$SHORT\`](https://github.com/$REPO/commit/$SHA) |" \
              "| **Message** | $MESSAGE |" \
              "" \
              "This was caught after the fact — \`main\` is not protected server-side," \
              "because the org's GitHub plan does not support rulesets on private" \
              "repositories. The apply-ready ruleset is committed at" \
              "\`.github/rulesets/main.json\`." \
              "" \
              "**If this was an accident**, open a PR that reverts it." \
              "**If it was deliberate**, close this issue with a note saying why, so" \
              "the signal stays meaningful.")

            gh issue create --repo "$REPO" \
              --title "Direct push to main: $SHORT" \
              --label bug \
              --body "$BODY"
            echo "📣 Opened an issue."
          else
            echo "📣 An open issue already covers this commit."
          fi

          exit 1
