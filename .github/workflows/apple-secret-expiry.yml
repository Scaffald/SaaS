name: Apple secret expiry check

# SC-60: The Apple OAuth client_secret is a 180-day JWT that silently
# expires and breaks production Apple sign-in. This workflow alerts us
# before that happens so we can rotate the secret on time.
#
# Trigger:
#   - Daily at 14:00 UTC (07:00 PT)
#   - Manual via workflow_dispatch
#   - On PR if .github/workflows/apple-secret-expiry.yml or
#     scripts/check-apple-secret-expiry.ts are changed (sanity)
#
# Required secret: APPLE_SECRET — same JWT stored in Supabase Dashboard
# (Auth → Providers → Apple). Keep it in sync there and in EAS Secrets.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/apple-secret-expiry.yml'
      - 'scripts/check-apple-secret-expiry.ts'

permissions:
  contents: read

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install

      - name: Check APPLE_SECRET expiry
        env:
          APPLE_SECRET: ${{ secrets.APPLE_SECRET }}
        run: pnpm tsx scripts/check-apple-secret-expiry.ts --warn-days 21
