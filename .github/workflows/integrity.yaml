name: "Monorepo Integrity & Code Quality"

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

jobs:
  code-quality:
    name: "Code Quality Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Prepare artifact directory
        run: mkdir -p artifacts/logs

      - name: Format, Lint & Type Check (pnpm check)
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee artifacts/logs/pnpm-check.log

      - name: Standalone Type Check (pnpm typecheck)
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee artifacts/logs/pnpm-typecheck.log

      - name: Build all packages
        run: pnpm build

      - name: Upload lint and typecheck logs
        if: always()
        id: lint_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-typecheck-logs
          path: artifacts/logs
          if-no-files-found: ignore

      - name: Link lint artifacts in PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          LINT_URL: ${{ steps.lint_artifacts.outputs.artifact-url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- ci-artifacts:code-quality -->'
            const links = []

            if (process.env.LINT_URL) {
              links.push(`- [Lint & typecheck logs](${process.env.LINT_URL})`)
            }

            if (!links.length) {
              core.info('No artifacts to link. Skipping comment.')
              return
            }

            const body = `${marker}\nCode quality artifacts for this run:\n${links.join('\n')}`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.issue,
              per_page: 100,
            })

            const existing = comments.find((comment) => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                ...context.repo,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                ...context.repo,
                body,
              })
            }

  monorepo-integrity:
    name: "Monorepo Integrity Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Check for duplicate dependencies in lock file (run `pnpm dedupe` to fix)
        run: pnpm dedupe --check

      - name: Check for conflicting dependency versions across the monorepo
        run: pnpm check-deps

      - name: Check for circular imports across the monorepo
        run: |
          chmod +x ./scripts/check-circular-deps.sh 
          pnpm check-circular-deps
