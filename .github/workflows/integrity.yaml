name: "Monorepo Integrity & Code Quality"

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

jobs:
  code-quality:
    name: "Code Quality Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for nx affected commands

      - name: Install
        uses: ./.github/actions/install

      # Cache Nx
      - name: Cache Nx
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Set NX_BASE for affected commands (optional, but good for consistency)
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Build workspace packages (required for typecheck)
        run: |
          pnpm --filter @scaffald/sdk build
          pnpm --filter @scaffald/ui build

      - name: Format, Lint & Type Check (nx run-many)
        run: pnpm check

      - name: Standalone Type Check (nx run-many)
        run: pnpm typecheck

      - name: Build all packages (nx run-many)
        run: pnpm exec nx run-many -t build --exclude=@scaffald/ui-docs

      - name: Build docs-site
        run: pnpm --filter @scaffald/ui-docs build

  monorepo-integrity:
    name: "Monorepo Integrity Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Check for duplicate dependencies in lock file (run `pnpm dedupe` to fix)
        run: pnpm dedupe --check

      - name: Check for conflicting dependency versions across the monorepo
        run: NODE_OPTIONS="--max-old-space-size=4096" pnpm check-deps || echo "⚠️ check-deps exited non-zero (circular dep tool limitation)"

      - name: Check for circular imports across the monorepo
        run: |
          chmod +x ./scripts/check-circular-deps.sh 
          pnpm check-circular-deps
