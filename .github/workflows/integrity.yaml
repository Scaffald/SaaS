name: "Monorepo Integrity & Code Quality"

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

jobs:
  code-quality:
    name: "Code Quality Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Turbo scope for PRs
        if: github.event_name == 'pull_request'
        run: echo "TURBO_FILTER=--filter=...[origin/${GITHUB_BASE_REF}]" >> $GITHUB_ENV

      - name: Install
        uses: ./.github/actions/install

      - name: Format, Lint & Type Check (pnpm check)
        run: |
          cmd="pnpm check"
          if [ -n "${TURBO_FILTER:-}" ]; then
            cmd="$cmd -- ${TURBO_FILTER}"
          fi
          echo "Running: $cmd"
          eval "$cmd"

      - name: Standalone Type Check (pnpm typecheck)
        run: |
          cmd="pnpm typecheck"
          if [ -n "${TURBO_FILTER:-}" ]; then
            cmd="$cmd -- ${TURBO_FILTER}"
          fi
          echo "Running: $cmd"
          eval "$cmd"

      - name: Build all packages
        run: pnpm build

  monorepo-integrity:
    name: "Monorepo Integrity Checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

      - name: Install
        uses: ./.github/actions/install

      - name: Check for duplicate dependencies in lock file (run `pnpm dedupe` to fix)
        run: pnpm dedupe --check

      - name: Check for conflicting dependency versions across the monorepo
        run: pnpm check-deps

      - name: Check for circular imports across the monorepo
        run: |
          chmod +x ./scripts/check-circular-deps.sh 
          pnpm check-circular-deps
