name: 'Monorepo Integrity'

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  monorepo-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Check for duplicate dependencies in lock file (run `yarn dedupe` to fix)
        run: yarn dedupe --check

      - name: Check for yarn constraints
        run: yarn constraints

      - name: Check for conflicting dependency versions across the monorepo
        run: yarn check-deps

      - name: Check for circular imports across the monorepo
        run: |
          chmod +x ./scripts/check-circular-deps.sh 
          yarn check-circular-deps

      - name: Check the linting using `sherif`
        run: yarn lint-sherif

      - name: Run unit tests with coverage
        run: yarn test --coverage

      - name: Generate coverage summary
        if: always()
        run: node ./scripts/ci/collect-coverage-summary.mjs

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-summary.md
            **/coverage/lcov.info
            **/coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Comment coverage summary on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const core = require('@actions/core')
            const path = 'coverage-summary.md'

            if (!fs.existsSync(path)) {
              core.info('No coverage summary generated; skipping PR comment.')
              return
            }

            const marker = '<!-- coverage-summary -->'
            const summary = fs.readFileSync(path, 'utf8')
            const body = `${marker}\n${summary}\n${marker}`

            const prNumber = context.payload.pull_request?.number ?? context.issue?.number

            if (!prNumber) {
              core.info('No PR context available; skipping comment.')
              return
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            })

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }
