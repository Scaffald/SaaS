name: Rotate Apple secret

# SC-60 follow-up: rotates APPLE_SECRET across all the places it lives.
#
# Trigger: workflow_dispatch (manual). Paste a freshly-generated JWT (from
# `pnpm node scripts/supabase-apple-auth-generate.js --token-only`) into
# the `new_apple_secret` input.
#
# The workflow then:
#   1. Validates the JWT structure + checks remaining lifetime > 90 days
#      (refuses to rotate to a secret that's already half-burned)
#   2. PATCHes /v1/projects/{ref}/config/auth on dev, preview, production
#      via the Supabase Management API, setting `external_apple_secret`
#   3. Updates the APPLE_SECRET GitHub Actions secret on this repo
#   4. Opens a PR updating the .env* files
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  — Personal access token from
#                            https://supabase.com/dashboard/account/tokens
#                            Scope: needs project config write on dev / preview / prod.
#   APPLE_SECRET           — current secret; replaced at the end of a successful run.
#
# Required repository variables (vars, not secrets — non-sensitive):
#   SUPABASE_PROJECT_REF_DEV      e.g. pmtdqrfpumqwkdhpgwcz
#   SUPABASE_PROJECT_REF_PREVIEW  e.g. uhjkipdwayqfihkanabk
#   SUPABASE_PROJECT_REF_PROD     e.g. qmfmpcyxsihhfttvqpbw
#
# Permissions: contents:write + pull-requests:write are needed for the
# auto-PR step. The GitHub secret update uses a separate GITHUB_TOKEN
# scoped to `actions:write` via the gh CLI.

on:
  workflow_dispatch:
    inputs:
      new_apple_secret:
        description: 'Freshly generated Apple OAuth client_secret JWT (paste full token)'
        required: true
        type: string
      dry_run:
        description: 'Validate only — do not push to Supabase or GitHub'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: apple-secret-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the input from logs
        # workflow_dispatch inputs are NOT secret-typed by GitHub, so they
        # appear in plain text in run logs unless we register a mask.
        run: echo "::add-mask::${{ inputs.new_apple_secret }}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/actions/install

      - name: Validate new APPLE_SECRET (exp > 90 days)
        env:
          APPLE_SECRET: ${{ inputs.new_apple_secret }}
        run: pnpm tsx scripts/check-apple-secret-expiry.ts --warn-days 90

      - name: Push to Supabase Management API (dev / preview / prod)
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEW_APPLE_SECRET: ${{ inputs.new_apple_secret }}
          PROJECT_REFS: |
            ${{ vars.SUPABASE_PROJECT_REF_DEV }}
            ${{ vars.SUPABASE_PROJECT_REF_PREVIEW }}
            ${{ vars.SUPABASE_PROJECT_REF_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          while IFS= read -r ref; do
            ref="$(echo "$ref" | xargs)"  # trim
            [ -z "$ref" ] && continue
            echo "→ Updating project $ref"
            http_code=$(curl -sS -o /tmp/sb-resp.json -w "%{http_code}" \
              -X PATCH "https://api.supabase.com/v1/projects/${ref}/config/auth" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg s "$NEW_APPLE_SECRET" '{external_apple_secret: $s}')")
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::Supabase API returned $http_code for project $ref"
              cat /tmp/sb-resp.json
              exit 1
            fi
            echo "  ok ($http_code)"
          done <<< "$PROJECT_REFS"

      - name: Update GitHub Actions secret APPLE_SECRET
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_APPLE_SECRET: ${{ inputs.new_apple_secret }}
        run: gh secret set APPLE_SECRET --body "$NEW_APPLE_SECRET" --repo "${{ github.repository }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Apple secret rotation"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Mode:** dry-run (no writes)"
            else
              echo "**Mode:** live (Supabase + GH secret)"
            fi
            echo ""
            echo "If the API step succeeded, double-check Supabase Dashboards:"
            echo "- https://supabase.com/dashboard/project/${{ vars.SUPABASE_PROJECT_REF_DEV }}/auth/providers"
            echo "- https://supabase.com/dashboard/project/${{ vars.SUPABASE_PROJECT_REF_PREVIEW }}/auth/providers"
            echo "- https://supabase.com/dashboard/project/${{ vars.SUPABASE_PROJECT_REF_PROD }}/auth/providers"
            echo ""
            echo "**Still manual after a successful run:**"
            echo "- EAS Secrets — \`eas secret:create --scope project --name APPLE_SECRET --type string --value <jwt> --force\`"
            echo "- Local \`.env*\` files (gitignored, per-developer) — paste the new JWT"
          } >> "$GITHUB_STEP_SUMMARY"
