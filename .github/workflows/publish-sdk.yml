name: Publish SDK to npm

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  publish:
    name: Build and Publish SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          cd packages/scaffald-sdk
          pnpm test

      - name: Type check
        run: |
          cd packages/scaffald-sdk
          pnpm typecheck

      - name: Lint
        run: |
          cd packages/scaffald-sdk
          pnpm lint

      - name: Build
        run: |
          cd packages/scaffald-sdk
          pnpm build

      - name: Verify build artifacts
        run: |
          cd packages/scaffald-sdk
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
          test -f dist/react/index.js
          test -f dist/react/index.mjs
          test -f dist/react/index.d.ts

      - name: Publish to npm (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd packages/scaffald-sdk
          npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          cd packages/scaffald-sdk
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: '@scaffald/sdk ${{ github.ref_name }}'
          body: |
            ## Scaffald SDK Release

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/packages/scaffald-sdk/CHANGELOG.md) for details.

            ### Installation

            ```bash
            npm install @scaffald/sdk@${{ github.ref_name }}
            ```

            ### Documentation

            - [README](https://github.com/${{ github.repository }}/blob/main/packages/scaffald-sdk/README.md)
            - [Examples](https://github.com/${{ github.repository }}/tree/main/packages/scaffald-sdk/examples)
          draft: false
          prerelease: false
