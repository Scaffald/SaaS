name: REST API Tests

on:
  pull_request:
    paths:
      - 'packages/supabase/functions/api/**'
      - 'packages/supabase/migrations/**'
      - 'packages/supabase/tests/**'
      - 'packages/supabase/types.ts'
      - 'scripts/test-api-local.ts'
      - 'scripts/types-owned-schemas.mjs'
      - 'scripts/deno.json'
      # This job runs the Supabase CLI — `supabase start`, `gen types` — so a
      # bump to it breaks the job without touching any path above. #936 did
      # exactly that (CLI 2.117 -> 2.118) and nothing noticed, because the
      # filter meant this never ran on main again. It surfaced days later on
      # an unrelated PR and read as that PR's fault.
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/supabase/functions/api/**'
      - 'packages/supabase/migrations/**'
      - 'packages/supabase/tests/**'
      - 'packages/supabase/types.ts'
      - 'scripts/test-api-local.ts'
      - 'scripts/types-owned-schemas.mjs'
      - 'scripts/deno.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write # the benchmark job comments results on the PR

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: |
          cd packages
          for attempt in 1 2 3; do
            supabase start && break
            echo "Attempt $attempt failed, retrying..."
            supabase stop --no-backup 2>/dev/null || true
            sleep 10
          done
        env:
          SUPABASE_DB_PASSWORD: postgres

      # A fresh `supabase start` has applied every migration file, so the types
      # generated from it are the truth: a difference means a migration merged
      # without `pnpm supa:generate` (#707). Uses the catalog-pinned CLI, not
      # the setup-cli one, so the output matches what a developer generates.
      #
      # Only the schemas this repo owns are compared. `storage`, `auth` and
      # `realtime` are introspected from whichever postgres-meta image the CLI
      # pulls, so they drift when Supabase ships, not when we do — the first
      # version of this check failed on four new `storage` columns
      # (versioning_status, archived_at, is_delete_marker, is_versioned) that
      # no amount of regenerating would have fixed.
      #
      # It also generates to a temp file rather than over types.ts, so a failure
      # leaves the working tree as it found it.
      - name: Check types.ts matches the migrations
        working-directory: packages/supabase
        run: |
          pnpm exec supabase --workdir .. gen types typescript --local > /tmp/types-fresh.ts

          node ../../scripts/types-owned-schemas.mjs types.ts          > /tmp/types-committed.slice
          node ../../scripts/types-owned-schemas.mjs /tmp/types-fresh.ts > /tmp/types-fresh.slice

          if ! diff -u /tmp/types-committed.slice /tmp/types-fresh.slice > /tmp/types.diff; then
            echo "::error file=packages/supabase/types.ts::types.ts is stale. Run \`pnpm supa:generate\` and commit the result."
            echo "Differences in the schemas this repo owns:"
            head -100 /tmp/types.diff
            exit 1
          fi
          echo "✅ types.ts matches the migrations"'"'

      - name: Wait for API
        run: |
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}"
          timeout 600 bash -c "until curl -sf http://127.0.0.1:54321/functions/v1/api/health -H \"apikey: \$ANON_KEY\" 2>/dev/null | grep -q ok; do sleep 2; done"

      # NOTE: seed data is applied automatically by `supabase start` via the
      # [db.seed] block in packages/supabase/config.toml (enabled = true,
      # sql_paths = ./seeds/*.sql). There is intentionally no explicit seed
      # step here: the previous `supabase db seed` aborted every run — `seed`
      # is not a valid `supabase db` subcommand in the pinned CLI — which left
      # this job with no signal for months (#400).

      # Report-only, deliberately. 72 of these fail today (measured 2026-09-26
      # on origin/main @ e675422de: 344 passed, 72 failed) on assertion and
      # fixture drift. The job was 100% red for months and gave no signal at
      # all, which is why it was muted (#412). #411 — the auth-user cleanup
      # that caused the original mass failure — is closed; what remains is
      # separate drift, so this comment no longer claims the suite is mid-repair
      # under that issue.
      #
      # The gating signal for this directory is the step below, which runs an
      # allowlist that may only grow. Move files out of here and into that list
      # as they go green, rather than flipping this whole step at once.
      - name: Run Unit Tests (report-only)
        continue-on-error: true
        working-directory: packages/supabase
        run: |
          deno test \
            --allow-all \
            --no-check \
            --config=functions/api/deno.json \
            --coverage=coverage \
            --junit-path=./test-results/junit.xml \
            functions/api/__tests__/lib/*.test.ts \
            functions/api/__tests__/routes/*.test.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          # Fall back to the well-known local demo keys, exactly as the
          # "Wait for API" and benchmark steps already do. Without this the
          # suites get an EMPTY string when the repo has no such secret set —
          # and `Deno.env.get(...) ?? default` in tests/shared/setup.ts only
          # falls back on undefined, not on "". Every test then dies on
          # `supabaseKey is required` and the failure looks like a broken test
          # rather than a missing key.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU' }}

      # Report-only for the same reason as the step above.
      - name: Run Integration Tests (report-only)
        continue-on-error: true
        working-directory: packages/supabase
        run: |
          deno test \
            --allow-all \
            --no-check \
            --config=functions/api/deno.json \
            --coverage=coverage \
            functions/api/__tests__/integration/*.test.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          # Fall back to the well-known local demo keys, exactly as the
          # "Wait for API" and benchmark steps already do. Without this the
          # suites get an EMPTY string when the repo has no such secret set —
          # and `Deno.env.get(...) ?? default` in tests/shared/setup.ts only
          # falls back on undefined, not on "". Every test then dies on
          # `supabaseKey is required` and the failure looks like a broken test
          # rather than a missing key.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU' }}

      # The one api-test step that can fail the build.
      #
      # `tests/routers/` holds the HTTP tests against the running edge function
      # — the tests that would have caught #900 (an endpoint 403ing every
      # caller, including super_admin) and #901 (an endpoint 500ing on every
      # request). Until now nothing ran them: no npm script referenced the
      # directory, and `prepush` only load-probes it with a filter that matches
      # no test, so it checked the files parse and ran zero assertions (#914).
      #
      # Most of that directory does not pass yet, so this runs an explicit
      # allowlist — `tests/routers/GATED.txt` — which may only grow. A file
      # earns its way in by passing on its own. That keeps the gate honest:
      # green here means something, and the list records exactly how much.
      #
      # No `continue-on-error`. That is the point.
      - name: Run gated HTTP API tests
        working-directory: packages/supabase
        run: |
          # `while read`, not `mapfile`: mapfile needs bash 4, and the bash on
          # a contributor's macOS is 3.2 — this has to be runnable by hand.
          PATHS=()
          while IFS= read -r f; do
            case "$f" in ''|\#*) continue ;; esac
            if [ ! -f "tests/routers/$f" ]; then
              echo "::error file=packages/supabase/tests/routers/GATED.txt::Listed file not found: $f"
              exit 1
            fi
            PATHS+=("tests/routers/$f")
          done < tests/routers/GATED.txt
          if [ ${#PATHS[@]} -eq 0 ]; then
            echo "::error::tests/routers/GATED.txt lists no files. The gate must run something."
            exit 1
          fi
          echo "Gating on ${#PATHS[@]} file(s): ${PATHS[*]}"
          deno test \
            --allow-all \
            --no-check \
            --config=tests/deno.json \
            "${PATHS[@]}"
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          # Fall back to the well-known local demo keys, exactly as the
          # "Wait for API" and benchmark steps already do. Without this the
          # suites get an EMPTY string when the repo has no such secret set —
          # and `Deno.env.get(...) ?? default` in tests/shared/setup.ts only
          # falls back on undefined, not on "". Every test then dies on
          # `supabaseKey is required` and the failure looks like a broken test
          # rather than a missing key.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU' }}

      - name: Generate Coverage Report
        working-directory: packages/supabase
        continue-on-error: true
        run: |
          deno coverage coverage --lcov --output=coverage/lcov.info

      # Coverage is reported, not gated. The old hard 100% requirement was
      # never met and kept this job red for months (#412). The REST API test
      # suite is mid-rehabilitation (#411: ~52 route tests still fail on
      # assertion/schema drift + GoTrue rate-limits under bulk user creation),
      # so a coverage gate is premature. Reinstate a ratchet (fail on drop
      # from a committed baseline) once the suite is stabilized and a real
      # baseline can be observed from a green run.
      - name: Report Coverage (non-gating)
        working-directory: packages/supabase
        continue-on-error: true
        run: |
          COVERAGE=$(deno coverage coverage --detailed | grep "Uncovered Lines" | awk '{print $5}' | sed 's/%//') || COVERAGE=100
          COVERED=$(echo "100 - ${COVERAGE:-100}" | bc)
          echo "Code Coverage: ${COVERED}% (informational; not a gate — see #412)"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/supabase/coverage/lcov.info
          flags: rest-api
          name: rest-api-coverage
          # A Codecov upload hiccup should not fail the pipeline.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: packages/supabase/test-results/
          retention-days: 30

      # Report-only while the suite is under repair (#411). Failures remain
      # fully visible in the published check and the uploaded artifact, but
      # don't block the pipeline — the job was 100% red for months and gave
      # no signal at all. Flip back to fail_on_failure: true (or a
      # baseline-diff ratchet) once #411 lands and the suite is green.
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'packages/supabase/test-results/junit.xml'
          check_name: REST API Test Results
          fail_on_failure: false

      - name: REST API endpoint verification
        run: |
          pnpm exec deno run --config=scripts/deno.json --allow-net --allow-env --allow-read scripts/test-api-local.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}

      - name: Stop Supabase
        if: always()
        run: |
          cd packages
          supabase stop --no-backup

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `needs: test` so the two jobs don't boot their own Supabase stacks in
    # parallel — that was ~5 minutes of duplicate Docker pull and init per PR.
    needs: test
    # Only run on PRs to main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase
        uses: supabase/setup-cli@v3

      - name: Start Supabase
        run: |
          cd packages
          supabase start

      - name: Run Benchmarks
        working-directory: packages/supabase
        continue-on-error: true
        run: |
          deno bench --allow-all functions/api/__tests__/benchmarks/rest-vs-trpc.bench.ts > benchmark-results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: packages/supabase/benchmark-results.txt

      - name: Comment Benchmark Results on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('packages/supabase/benchmark-results.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Performance Benchmark Results\n\n\`\`\`\n${results}\n\`\`\``
            });

      - name: Stop Supabase
        if: always()
        run: |
          cd packages
          supabase stop --no-backup

  lint:
    name: Lint REST API Code
    runs-on: ubuntu-latest
    # 15, not 5. #924 added "Type Check (ratchet)", which runs `deno check`
    # over all 25 edge functions — about four minutes on its own, and more
    # than the five this job allowed once lint and format have had their
    # share. The job hit the ceiling at exactly 5:00 and was cancelled, which
    # surfaces as `##[error]The operation was canceled` with no failing check
    # named, then fails "All Tests Passed".
    #
    # Reproduced on main at 28e155051 — the commit that added the step — so
    # every PR touching packages/supabase has been red for this reason since.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Code
        working-directory: packages/supabase/functions/api
        run: deno lint

      - name: Format Check
        working-directory: packages/supabase/functions/api
        run: deno fmt --check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'packages/supabase/functions/api'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  status-check:
    name: All Tests Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, lint, security]
    if: always()

    steps:
      - name: Check test status
        if: needs.test.result != 'success'
        run: exit 1

      - name: Check lint status
        if: needs.lint.result != 'success'
        run: exit 1

      - name: Check security status
        if: needs.security.result != 'success'
        run: exit 1

      - name: All checks passed
        run: echo "✅ All REST API tests and checks passed!"
