name: REST API Tests

on:
  pull_request:
    paths:
      - 'packages/supabase/functions/api/**'
      - 'scripts/test-api-local.ts'
      - 'scripts/deno.json'
      - '.github/workflows/api-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/supabase/functions/api/**'
      - 'scripts/test-api-local.ts'
      - 'scripts/deno.json'

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Supabase services will be started via CLI
      postgres:
        image: supabase/postgres:15.1.0.147
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Supabase
        run: |
          cd packages
          supabase start
        env:
          SUPABASE_DB_PASSWORD: postgres

      - name: Wait for API
        run: |
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:54321/functions/v1/api/health 2>/dev/null | grep -q ok; do sleep 2; done'

      - name: Seed database
        run: |
          cd packages
          supabase db seed

      - name: Run Unit Tests
        working-directory: packages/supabase
        run: |
          deno test \
            --allow-all \
            --coverage=coverage \
            --junit-path=./test-results/junit.xml \
            functions/api/__tests__/routes/*.test.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_LOCAL }}

      - name: Run Integration Tests
        working-directory: packages/supabase
        run: |
          deno test \
            --allow-all \
            --coverage=coverage \
            functions/api/__tests__/integration/*.test.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_LOCAL }}

      - name: Generate Coverage Report
        working-directory: packages/supabase
        run: |
          deno coverage coverage --lcov --output=coverage/lcov.info

      - name: Check Coverage Threshold
        working-directory: packages/supabase
        run: |
          # Extract coverage percentage from lcov
          COVERAGE=$(deno coverage coverage --detailed | grep "Uncovered Lines" | awk '{print $5}' | sed 's/%//')

          # Convert to covered percentage
          COVERED=$(echo "100 - $COVERAGE" | bc)

          echo "Code Coverage: ${COVERED}%"

          # Enforce 100% coverage for REST API
          if (( $(echo "$COVERED < 100" | bc -l) )); then
            echo "❌ Coverage ${COVERED}% is below required 100%"
            exit 1
          else
            echo "✅ Coverage requirement met: ${COVERED}%"
          fi

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./packages/supabase/coverage/lcov.info
          flags: rest-api
          name: rest-api-coverage
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: packages/supabase/test-results/
          retention-days: 30

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'packages/supabase/test-results/junit.xml'
          check_name: REST API Test Results
          fail_on_failure: true

      - name: REST API endpoint verification
        run: |
          pnpm exec deno run --config=scripts/deno.json --allow-net --allow-env --allow-read scripts/test-api-local.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}

      - name: Stop Supabase
        if: always()
        run: |
          cd packages
          supabase stop --no-backup

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on PRs to main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase
        uses: supabase/setup-cli@v2

      - name: Start Supabase
        run: |
          cd packages
          supabase start

      - name: Run Benchmarks
        working-directory: packages/supabase
        run: |
          deno bench --allow-all functions/api/__tests__/benchmarks/rest-vs-trpc.bench.ts > benchmark-results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: packages/supabase/benchmark-results.txt

      - name: Comment Benchmark Results on PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('packages/supabase/benchmark-results.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Performance Benchmark Results\n\n\`\`\`\n${results}\n\`\`\``
            });

      - name: Stop Supabase
        if: always()
        run: |
          cd packages
          supabase stop --no-backup

  lint:
    name: Lint REST API Code
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Lint Code
        working-directory: packages/supabase/functions/api
        run: deno lint

      - name: Format Check
        working-directory: packages/supabase/functions/api
        run: deno fmt --check

      - name: Type Check
        working-directory: packages/supabase/functions/api
        run: deno check index.ts

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'packages/supabase/functions/api'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  status-check:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()

    steps:
      - name: Check test status
        if: needs.test.result != 'success'
        run: exit 1

      - name: Check lint status
        if: needs.lint.result != 'success'
        run: exit 1

      - name: Check security status
        if: needs.security.result != 'success'
        run: exit 1

      - name: All checks passed
        run: echo "✅ All REST API tests and checks passed!"
