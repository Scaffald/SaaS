name: Lighthouse CI

# Was running on every PR at ~20 minutes with no path filter, and nothing gated
# on the result. Now: nightly, on demand, and on any PR labelled `ci:full`.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` (nx run-many across every package) used to run here as well.
      # `web:build` is the only build Lighthouse actually audits, so the extra
      # pass was ~6 minutes of duplicate work on every run.
      - name: Start server
        run: |
          pnpm web:build
          pnpm web:serve &
          sleep 10
        env:
          NODE_ENV: production
          PORT: 8081
          # expo export resolves these at static-render time; without them the
          # export dies with "EXPO_PUBLIC_SUPABASE_URL is not set" before
          # Lighthouse measures anything.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8081/
            http://localhost:8081/dashboard
            http://localhost:8081/dashboard/profile/general
            http://localhost:8081/dashboard/discover/workers
            http://localhost:8081/dashboard/discover/jobs
            http://localhost:8081/dashboard/discover/employers
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: '.lighthouserc.json'

    # Note: Create .lighthouserc.json with performance budgets
    # See: https://github.com/GoogleChrome/lighthouse-ci/blob/main/docs/configuration.md

