name: Lighthouse CI

# Was running on every PR at ~20 minutes with no path filter, and nothing gated
# on the result. Now: nightly, on demand, and on any PR labelled `ci:full`.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    # 18 throttled runs at ~35 s each, after a ~7 min export.
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` (nx run-many across every package) used to run here, and
      # dropping it to save ~6 minutes is what broke this workflow: it was also
      # the step that built @scaffald/sdk. The SDK is a submodule whose dist/ is
      # gitignored and it has no `prepare` script, so `pnpm install` does not
      # build it — and app code imports `@scaffald/sdk/react`, which the package
      # exports as ./dist/react/index.mjs. Without that file the export dies:
      #
      #   Unable to resolve module @scaffald/sdk/react from
      #   apps/scaffald/app/(admin)/office/cms/teams/[id]/edit.tsx
      #
      # `nx run scf-core:build` is the cheap version of the build that was
      # removed. `build` declares dependsOn ["^build"], so this one command
      # builds @scaffald/ui, @scaffald/sdk, supabase and scf-schemas first —
      # everything web:build needs, and nothing it doesn't. Verified by
      # reproducing CI: packages/sdk/dist is absent after a plain
      # `pnpm install --frozen-lockfile` and present after this command.
      - name: Build workspace packages
        run: pnpm nx run scf-core:build

      - name: Start server
        run: |
          pnpm web:build

          # `web:server` (apps/scaffald/server/index.js), not `web:serve`
          # (`expo serve`). The two differ in the one way that decides every
          # number this job reports: `expo serve` sends the entry bundle
          # **uncompressed**.
          #
          #   expo serve       17.42 MB
          #   production (br)   3.27 MB
          #   production (gzip) 3.64 MB
          #
          # Lighthouse runs `formFactor: mobile` with simulated Slow 4G
          # (1474 Kbps down). 17.4 MB at that rate is 97 seconds, which is
          # exactly what it was reporting — LCP ~93s and TTI ~94s, capped by
          # maxWaitForLoad. Those were never page bugs (#787); they were an
          # honest simulation of a bundle five times larger than the one
          # production actually ships.
          #
          # server/index.js applies `compression()` and serves `/_expo` as
          # immutable, which is what production does, so the audit measures
          # something a real visitor could experience. The root has no
          # `web:serve` either — that was the previous fault here.
          pnpm --filter scaffald-app web:server > /tmp/web-serve.log 2>&1 &
          echo $! > /tmp/web-serve.pid

          # `sleep 10` was the whole readiness check, and it is not one. With
          # the SSR export there is no static index.html to fall back on — the
          # server has to be up and answering — so a slow start handed
          # Lighthouse a dead port and it reported:
          #
          #   CHROME_INTERSTITIAL_ERROR ... test URL (http://localhost:8081/)
          #   was redirected to chrome-error://chromewebdata/
          #
          # which reads like a broken page and is an empty socket. Poll instead,
          # and fail here with the server's own log rather than letting
          # Lighthouse report a performance failure it never measured.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "http://localhost:8081/"; then
              echo "✅ server answering after ${i}s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/web-serve.pid)" 2>/dev/null; then
              echo "::error::web:serve exited before it answered."
              cat /tmp/web-serve.log
              exit 1
            fi
            sleep 1
          done

          echo "::error::Server did not answer on http://localhost:8081/ within 60s."
          cat /tmp/web-serve.log
          exit 1
        env:
          NODE_ENV: production
          PORT: 8081
          # expo export resolves these at static-render time; without them the
          # export dies with "EXPO_PUBLIC_SUPABASE_URL is not set" before
          # Lighthouse measures anything.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Budgets are `warn`, not `error`, in .lighthouserc.json — deliberately,
      # and temporarily. This workflow had never completed a run, so those
      # numbers had never been measured against anything. The first run that
      # did complete missed every one of them on all six pages (#774: /jobs
      # alone reports a 94s LCP). A budget nothing has ever met is a wish, not
      # a regression gate, and leaving it as `error` would mean this job is red
      # every night for a reason no single change caused — which is how a
      # nightly stops being read.
      #
      # So the job now fails on what it is actually able to police: the build,
      # the server, and Lighthouse being able to load the pages at all.
      #
      # The budgets themselves are a ratchet, set from measurement rather than
      # aspiration (#782, 2026-09-17): the medians of a production export on
      # this preset after #783 (rows server-rendered) and #782 (the server
      # renders the phone layout for a phone), plus ~15% headroom — /jobs:
      # perf 0.53, FCP/LCP 3.0 s, SI 22 s, TBT 1.5 s, CLS 0.0; the other public
      # pages sit near those. Lower a number when a PR beats it; never raise
      # one. They go back to `error` once the nightly's own harness (server
      # start-up, PROTOCOL_TIMEOUT retries — see #774) stops being the reason
      # a run fails.
      # Lighthouse measures whatever the server paints, including a page whose
      # JavaScript died before hydration. With route splitting on, the SSR
      # HTML once emitted every chunk `async` and the entry chunk raced the
      # shared one it requires: every page rendered blank with "Requiring
      # unknown module" and no metric here would have said so (#797). The
      # boot audit loads each public page in a real browser and fails the job
      # if any page throws or renders no text, before a single number is
      # reported for it.
      - name: Every public page boots
        run: |
          pnpm exec playwright install chromium
          node scripts/audit/boot-pages.mjs http://localhost:8081

      # `.lighthouserc.json` sets `throttlingMethod: devtools` (real CPU and
      # network throttling) rather than Lighthouse's default `simulate`. The
      # simulated LCP is a Lantern estimate built from an unthrottled trace,
      # and on this build it is bimodal: the deferred chunks download and
      # execute within ~450 ms on localhost, so whenever Chrome's unthrottled
      # first paint happens to land after them, Lantern folds the entire
      # hydration cost into LCP and reports ~13 s for a paint that observably
      # happened at 0.9 s. Same commit, same page: 2.2 s or 13 s, two runs out
      # of three (#797). Devtools throttling measures the paint that actually
      # happens under throttling — 1.3 s, three runs within 60 ms. Each run
      # takes ~35 s instead of ~13 s; the numbers are not comparable with
      # runs before this change.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Four of the six URLs audited here had not existed for months —
          # /dashboard/profile/general and the three /dashboard/discover/*
          # pages all 404 (confirmed against production). Lighthouse reported
          # that as "unable to reliably load the page you requested
          # (Status code: 404)" and failed the whole run, which is why this
          # list is worth checking rather than inheriting.
          #
          # The set is now the public, crawlable pages: they are the ones an
          # anonymous visitor and a search engine actually reach, so the SEO
          # and accessibility assertions in .lighthouserc.json mean something
          # against them. The authenticated surfaces are deliberately absent —
          # Lighthouse has no session, so auditing /dashboard measures the
          # redirect to /auth and nothing else.
          urls: |
            http://localhost:8081/
            http://localhost:8081/jobs
            http://localhost:8081/support
            http://localhost:8081/privacy
            http://localhost:8081/terms
            http://localhost:8081/contact
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: '.lighthouserc.json'

    # Note: Create .lighthouserc.json with performance budgets
    # See: https://github.com/GoogleChrome/lighthouse-ci/blob/main/docs/configuration.md

