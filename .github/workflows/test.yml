name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for nx affected commands

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - uses: pnpm/action-setup@v2
        with:
          version: 10.20.0

      # Cache Nx
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Set NX_BASE for affected commands
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Typecheck (affected)
        run: pnpm affected:typecheck

      - name: Lint (affected)
        run: pnpm affected:lint

      - name: Test (affected)
        run: pnpm affected:test

      - name: Test Health
        run: pnpm test:health
        if: always()

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: tests/reports/coverage/junit.xml
          check_name: Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: tests/reports/coverage/
          retention-days: 30
