name: Release @scaffald/ui

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'packages/scaffald-ui/**'
      - '!packages/scaffald-ui/docs-site/**'
      - '!packages/scaffald-ui/**/*.md'
  workflow_dispatch:

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @scaffald/ui typecheck

      - name: Lint
        run: pnpm --filter @scaffald/ui lint

      # TODO: Re-enable after fixing vitest include path (points to beyond-ui) and test stability
      # - name: Run tests
      #   run: pnpm --filter @scaffald/ui test

      - name: Build package
        run: pnpm --filter @scaffald/ui build

      - name: Verify build artifacts
        run: |
          cd packages/scaffald-ui
          test -f dist/index.js || exit 1
          test -f dist/index.mjs || exit 1
          test -f dist/index.d.ts || exit 1
          test -f dist/tokens/index.js || exit 1
          test -f dist/tokens/index.mjs || exit 1
          test -f dist/tokens/index.d.ts || exit 1
          echo "✅ All build artifacts verified"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/scaffald-ui
          npx semantic-release
