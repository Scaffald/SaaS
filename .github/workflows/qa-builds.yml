name: QA mobile builds

# On every scaffald-app release tag, build the `qa` EAS profile for iOS
# (simulator .app, iPhone + iPad) and Android (.apk) and attach both to the
# GitHub release, so the daily QA run can install the app without building it
# (#1419). Both are Release builds pointed at dev with no dev client: they run
# with no Metro.
#
# The builds run on EAS: this job uploads the tagged checkout (`eas build`,
# as scripts/ship-ios.sh does), waits for both builds and attaches the files.
# The wait is billed Actions time (~25-40 min per release, ubuntu runner).
# EAS Workflows (--ref, no wait here) would avoid that, but the EAS project has
# no GitHub repository linked since the org move.
#
# Docs for the QA agent: docs/agents/QA-BUILDS.md.

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to (app-vX.Y.Z). Empty = latest app-v* tag.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: qa-builds-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@27.11.0

jobs:
  qa-builds:
    name: Build qa (iOS sim + Android APK) and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/app-v" \
              -q '.[].ref | sub("refs/tags/"; "")' | sort -V | tail -1)
          fi
          case "$TAG" in app-v*) ;; *) echo "::error::Not an app-v* tag: $TAG"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#app-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          submodules: true

      # eas-cli evaluates apps/scaffald/app.config.ts, which resolves config
      # plugins from node_modules, so it needs the install.
      - uses: ./.github/actions/install

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "scaffald-app v${VERSION}" \
              --notes "scaffald-app v${VERSION}. See CHANGELOG.md."
          fi

      - name: Build qa on EAS and wait
        working-directory: apps/scaffald
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not configured."
            exit 1
          fi
          # Uploads this checkout (submodules included) like scripts/ship-ios.sh
          # does; EAS-side GitHub cloning is not set up for this project.
          pnpm dlx "$EAS_CLI" build --profile qa --platform all \
            --non-interactive --wait --json > "$RUNNER_TEMP/builds.json"
          jq -r '.[] | "\(.platform) \(.id) \(.status) \(.artifacts.buildUrl)"' "$RUNNER_TEMP/builds.json"
          if jq -e '[.[] | select(.status != "FINISHED")] | length > 0' "$RUNNER_TEMP/builds.json" >/dev/null; then
            echo "::error::An EAS build did not finish. https://expo.dev/accounts/unicorn-love/projects/scf-scaffald/builds"
            exit 1
          fi

      - name: Download artifacts
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qa"
          mkdir -p "$OUT/ios"
          IOS_URL=$(jq -r '.[] | select(.platform == "IOS") | .artifacts.buildUrl' "$RUNNER_TEMP/builds.json")
          APK_URL=$(jq -r '.[] | select(.platform == "ANDROID") | .artifacts.buildUrl' "$RUNNER_TEMP/builds.json")
          # The simulator build is a tar.gz holding the .app; re-zip it so
          # symlinks inside the bundle survive (zip -y).
          curl -fsSL "$IOS_URL" -o "$OUT/ios.tar.gz"
          tar -xzf "$OUT/ios.tar.gz" -C "$OUT/ios"
          APP=$(find "$OUT/ios" -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$APP" ] || { echo "::error::No .app in the iOS artifact"; exit 1; }
          (cd "$(dirname "$APP")" && zip -qry "$OUT/Scaffald-${VERSION}-sim.app.zip" "$(basename "$APP")")
          curl -fsSL "$APK_URL" -o "$OUT/Scaffald-${VERSION}.apk"
          ls -la "$OUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qa"
          gh release upload "$TAG" --clobber \
            "$OUT/Scaffald-${VERSION}-sim.app.zip" \
            "$OUT/Scaffald-${VERSION}.apk"

          # Replace the QA block in the notes (idempotent on re-runs).
          gh release view "$TAG" --json body -q .body \
            | sed '/<!-- qa-builds -->/,/<!-- \/qa-builds -->/d' > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF
          <!-- qa-builds -->
          ### QA builds

          Commit \`${SHA}\` (compare with https://dev.scaffald.com/build.json). Release builds against **dev**, no dev client, no Metro needed.

          - \`Scaffald-${VERSION}-sim.app.zip\`: iOS simulator (iPhone and iPad). \`unzip\`, then \`xcrun simctl install booted Scaffald*.app\`.
          - \`Scaffald-${VERSION}.apk\`: Android emulator. \`adb install -r Scaffald-${VERSION}.apk\`.

          EAS builds: $(jq -r '[.[] | "https://expo.dev/accounts/unicorn-love/projects/scf-scaffald/builds/\(.id)"] | join(" ")' "$RUNNER_TEMP/builds.json")
          <!-- /qa-builds -->
          EOF
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
