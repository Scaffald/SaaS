name: Deploy Web App

on:
  push:
    branches:
      - main # Production deployments
      - staging # Staging deployments
      - preview # Preview deployments
  pull_request:
    branches:
      - main
      - preview
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.17.1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ===== CHECKOUT =====
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better caching

      # ===== SETUP PNPM =====
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      # ===== SETUP NODE =====
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # ===== CACHE DEPENDENCIES =====
      - name: 💾 Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
            apps/expo/.expo
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ===== INSTALL DEPENDENCIES =====
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # ===== BUILD PACKAGES =====
      - name: 🏗️ Build workspace packages
        run: |
          echo "Building UI package..."
          pnpm --filter @app/ui build
          echo "Building Core package..."
          pnpm --filter @app/core build
          echo "Building Schemas package..."
          pnpm --filter @app/schemas build

      # ===== RUN QUALITY CHECKS =====
      - name: 🔍 Run quality checks
        run: |
          pnpm typecheck
          pnpm lint
        continue-on-error: true # Don't fail deploy on lint warnings

      # ===== CHAOS/PERFORMANCE GATES =====
      - name: 🧪 Chaos & performance gates
        if: github.event_name != 'pull_request'
        env:
          CHAOS_LATENCY_ENDPOINT: ${{ secrets.CHAOS_LATENCY_ENDPOINT }}
          CHAOS_LATENCY_TOKEN: ${{ secrets.CHAOS_LATENCY_TOKEN }}
          CHAOS_LATENCY_MS: ${{ vars.CHAOS_LATENCY_MS || '250' }}
          # Supabase
          EXPO_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # App URL
          EXPO_PUBLIC_URL: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_URL || secrets.EXPO_PUBLIC_URL }}
          # Google OAuth
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_SCHEME: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_GOOGLE_IOS_SCHEME || secrets.EXPO_PUBLIC_GOOGLE_IOS_SCHEME }}
          # Mapbox
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_MAPBOX_TOKEN || secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_MAPBOX_API_URL: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_MAPBOX_API_URL || secrets.EXPO_PUBLIC_MAPBOX_API_URL }}
        run: pnpm release:gates

      # ===== BUILD WEB APP =====
      - name: 🚀 Build web application
        working-directory: apps/expo
        env:
          NODE_ENV: production
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'staging' }}
          # Supabase
          EXPO_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # App URL
          EXPO_PUBLIC_URL: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_URL || secrets.EXPO_PUBLIC_URL }}
          # Google OAuth
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_SCHEME: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_GOOGLE_IOS_SCHEME || secrets.EXPO_PUBLIC_GOOGLE_IOS_SCHEME }}
          # Mapbox
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_MAPBOX_TOKEN || secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_MAPBOX_API_URL: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_MAPBOX_API_URL || secrets.EXPO_PUBLIC_MAPBOX_API_URL }}
          # Build optimizations
          EXPO_USE_FAST_REFRESH: false
          TAMAGUI_DISABLE_WARN_DYNAMIC_LOAD: 1
        run: |
          echo "🏗️ Building web app for $APP_ENV..."
          pnpm web:build
          echo "✅ Build complete!"
          ls -lah dist/

      # ===== CREATE _redirects FILE =====
      - name: 📝 Create redirects file
        working-directory: apps/expo
        run: |
          echo "Creating _redirects for SPA routing..."
          echo "/* /index.html 200" > dist/_redirects
          cat dist/_redirects

      # ===== UPLOAD ARTIFACT =====
      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: apps/expo/dist/
          retention-days: 7

      # ===== DEPLOY EDGE FUNCTIONS (Production Only) =====
      - name: 🔧 Deploy Edge Functions to Supabase
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'
        working-directory: packages/supabase
        env:
          SUPABASE_ENV_LABEL: ${{ github.ref == 'refs/heads/preview' && 'preview' || 'production' }}
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ github.ref == 'refs/heads/preview' && secrets.PREVIEW_SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Deploying Edge Functions to ${SUPABASE_ENV_LABEL}..."
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            pnpx supabase functions deploy trpc --project-ref $SUPABASE_PROJECT_ID || echo "⚠️ tRPC deployment skipped"
            pnpx supabase functions deploy job-import --project-ref $SUPABASE_PROJECT_ID || echo "⚠️ job-import deployment skipped"
            pnpx supabase functions deploy news --project-ref $SUPABASE_PROJECT_ID || echo "⚠️ news deployment skipped"
            echo "✅ Edge Functions deployed"
          else
            echo "⏭️ Skipping Edge Functions deployment (secrets not configured)"
          fi
        continue-on-error: true

      # ===== DEPLOY TO AWS (Optional) =====
      - name: ☁️ Deploy to AWS S3 + CloudFront
        if: secrets.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          # Determine environment based on branch
          AWS_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || github.ref == 'refs/heads/dev' && 'dev' || 'production' }}
          # Environment-specific bucket names
          AWS_S3_BUCKET: ${{ github.ref == 'refs/heads/main' && secrets.AWS_S3_BUCKET_PROD || github.ref == 'refs/heads/preview' && secrets.AWS_S3_BUCKET_PREVIEW || github.ref == 'refs/heads/dev' && secrets.AWS_S3_BUCKET_DEV || secrets.AWS_S3_BUCKET_PROD }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ github.ref == 'refs/heads/main' && secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_PROD || github.ref == 'refs/heads/preview' && secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_PREVIEW || github.ref == 'refs/heads/dev' && secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV || secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_PROD }}
        run: |
          echo "🚀 Deploying to AWS S3 + CloudFront ($AWS_ENV environment)..."
          
          # Install AWS CLI if not present
          if ! command -v aws &> /dev/null; then
            echo "Installing AWS CLI..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          fi
          
          # Verify AWS credentials
          aws sts get-caller-identity
          
          # Determine bucket name if not set via secrets
          if [ -z "$AWS_S3_BUCKET" ] || [ "$AWS_S3_BUCKET" == "" ]; then
            case "$AWS_ENV" in
              dev)
                AWS_S3_BUCKET="scaffald-app-dev"
                ;;
              preview)
                AWS_S3_BUCKET="scaffald-app-preview"
                ;;
              production)
                AWS_S3_BUCKET="scaffald-app-prod"
                ;;
            esac
          fi
          
          echo "Environment: $AWS_ENV"
          echo "Bucket: $AWS_S3_BUCKET"
          if [ -n "$AWS_CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "CloudFront Distribution: $AWS_CLOUDFRONT_DISTRIBUTION_ID"
          fi
          
          # Upload to S3
          echo "Uploading files to S3..."
          aws s3 sync ./apps/expo/dist s3://$AWS_S3_BUCKET \
            --delete \
            --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "_redirects" \
            --exclude "_headers"
          
          # Upload HTML files with no cache
          aws s3 sync ./apps/expo/dist s3://$AWS_S3_BUCKET \
            --delete \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"
          
          # Upload redirects and headers
          if [ -f ./apps/expo/dist/_redirects ]; then
            aws s3 cp ./apps/expo/dist/_redirects s3://$AWS_S3_BUCKET/_redirects
          fi
          
          if [ -f ./apps/expo/dist/_headers ]; then
            aws s3 cp ./apps/expo/dist/_headers s3://$AWS_S3_BUCKET/_headers
          fi
          
          # Invalidate CloudFront cache
          if [ -n "$AWS_CLOUDFRONT_DISTRIBUTION_ID" ] && [ "$AWS_CLOUDFRONT_DISTRIBUTION_ID" != "" ]; then
            echo "Invalidating CloudFront cache..."
            INVALIDATION_ID=$(aws cloudfront create-invalidation \
              --distribution-id $AWS_CLOUDFRONT_DISTRIBUTION_ID \
              --paths "/*" \
              --query 'Invalidation.Id' \
              --output text)
            echo "✅ Cache invalidation created: $INVALIDATION_ID"
          else
            echo "⚠️ CloudFront distribution ID not set for $AWS_ENV environment, skipping cache invalidation"
            echo "   Set AWS_CLOUDFRONT_DISTRIBUTION_ID_$AWS_ENV secret to enable cache invalidation"
          fi
          
          echo "✅ AWS deployment complete!"
        continue-on-error: true

      # ===== BUILD SUMMARY =====
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date)" >> $GITHUB_STEP_SUMMARY
