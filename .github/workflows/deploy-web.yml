name: Deploy Web App

on:
  push:
    branches:
      - prod       # → production (app.scaffald.com)
      - preview    # → preview (preview.scaffald.com)
      - main       # → dev (dev.scaffald.com)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, preview, production]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.17.1"

# Prevent concurrent deployments to the same environment
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Environment gate — production requires manual approval
    environment: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}

    steps:
      # ===== CHECKOUT =====
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== SETUP =====
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # ===== CACHE =====
      - name: 💾 Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: 💾 Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # ===== INSTALL =====
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      # ===== BUILD WORKSPACE PACKAGES =====
      - name: 🏗️ Build workspace packages
        run: |
          pnpm nx run @scaffald/ui:build
          pnpm nx run scf-core:build
          pnpm nx run scf-schemas:build

      # ===== QUALITY CHECKS (non-blocking) =====
      - name: 🔍 Quality checks
        run: |
          pnpm nx affected -t typecheck --base=origin/main --head=HEAD || true
          pnpm nx affected -t lint --base=origin/main --head=HEAD || true
        continue-on-error: true

      # ===== BUILD WEB APP =====
      - name: 🚀 Build web app
        working-directory: apps/scaffald
        env:
          NODE_ENV: production
          APP_ENV: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}
          # Supabase — prod uses main project, dev/preview use branches on the same project
          EXPO_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/prod' && secrets.EXPO_PUBLIC_SUPABASE_URL || github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_URL || secrets.DEV_EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/prod' && secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.DEV_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # App URL
          EXPO_PUBLIC_URL: ${{ github.ref == 'refs/heads/prod' && 'https://beta.scaffald.com' || github.ref == 'refs/heads/preview' && 'https://prev.scaffald.com' || 'https://sandbox.scaffald.com' }}
          # Google OAuth — shared across all environments (same GCP project)
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_SCHEME: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_SCHEME }}
          # Mapbox
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_MAPBOX_API_URL: ${{ secrets.EXPO_PUBLIC_MAPBOX_API_URL }}
          # PostHog
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          # Build flags
          EXPO_USE_FAST_REFRESH: "false"
        run: |
          echo "🏗️ Building for $APP_ENV..."
          pnpm web:build
          echo "/* /index.html 200" > dist/_redirects
          echo "✅ Build complete ($(du -sh dist | cut -f1))"
          ls -la dist/

      # ===== UPLOAD ARTIFACT =====
      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: apps/scaffald/dist/
          retention-days: 7

      # ===== DEPLOY EDGE FUNCTIONS =====
      # prod → main project, preview → preview branch, main → dev branch
      - name: 🔧 Deploy Edge Functions
        if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'
        working-directory: packages/supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ github.ref == 'refs/heads/prod' && secrets.SUPABASE_PROJECT_ID || github.ref == 'refs/heads/preview' && secrets.PREVIEW_SUPABASE_BRANCH_ID || secrets.DEV_SUPABASE_BRANCH_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "⏭️ Supabase secrets not configured — skipping edge functions"
            exit 0
          fi
          for func in job-import news; do
            pnpx supabase functions deploy "$func" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --auth-token "$SUPABASE_ACCESS_TOKEN" \
              || echo "⚠️ $func deployment failed (non-blocking)"
          done
        continue-on-error: true

      # ===== DEPLOY TO AWS =====
      - name: ☁️ Deploy to S3 + CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCAFFALD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCAFFALD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SCAFFALD_AWS_REGION || 'us-east-1' }}
          AWS_ENV: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}
          AWS_S3_BUCKET: ${{ github.ref == 'refs/heads/prod' && secrets.SCAFFALD_AWS_S3_BUCKET_PROD || github.ref == 'refs/heads/preview' && secrets.SCAFFALD_AWS_S3_BUCKET_PREVIEW || secrets.SCAFFALD_AWS_S3_BUCKET_DEV }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ github.ref == 'refs/heads/prod' && secrets.SCAFFALD_AWS_CLOUDFRONT_DISTRIBUTION_ID_PROD || github.ref == 'refs/heads/preview' && secrets.SCAFFALD_AWS_CLOUDFRONT_DISTRIBUTION_ID_PREVIEW || secrets.SCAFFALD_AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "⏭️ AWS secrets not configured — skipping deploy"
            exit 0
          fi

          aws sts get-caller-identity

          echo "🚀 Deploying to $AWS_ENV → s3://$AWS_S3_BUCKET"

          # Assets: long cache
          aws s3 sync apps/scaffald/dist s3://$AWS_S3_BUCKET \
            --delete \
            --exclude "*.html" --exclude "_redirects" --exclude "_headers" --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable"

          # HTML: no cache
          aws s3 sync apps/scaffald/dist s3://$AWS_S3_BUCKET \
            --delete \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"

          # Support files
          for f in _redirects _headers; do
            [ -f "apps/scaffald/dist/$f" ] && \
              aws s3 cp "apps/scaffald/dist/$f" "s3://$AWS_S3_BUCKET/$f"
          done

          # Invalidate CloudFront
          if [ -n "$AWS_CLOUDFRONT_DISTRIBUTION_ID" ]; then
            INV_ID=$(aws cloudfront create-invalidation \
              --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
              --paths "/*" --query 'Invalidation.Id' --output text)
            echo "✅ Cache invalidation: $INV_ID"
          fi

      # ===== SMOKE TEST =====
      - name: 🧪 Smoke test
        if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'
        env:
          APP_ENV: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}
          DISTRIBUTION_ID: ${{ github.ref == 'refs/heads/prod' && secrets.SCAFFALD_AWS_CLOUDFRONT_DISTRIBUTION_ID_PROD || github.ref == 'refs/heads/preview' && secrets.SCAFFALD_AWS_CLOUDFRONT_DISTRIBUTION_ID_PREVIEW || secrets.SCAFFALD_AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCAFFALD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCAFFALD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SCAFFALD_AWS_REGION || 'us-east-1' }}
        run: |
          # Wait up to 3 minutes for CloudFront invalidation to begin propagating
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "⏭️ No distribution ID — skipping smoke test"
            exit 0
          fi
          echo "⏳ Waiting 30s for CloudFront to start propagating..."
          sleep 30
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION_ID" \
            --query 'Distribution.DomainName' --output text \
            --region us-east-1 2>/dev/null || echo "")
          if [ -n "$CF_DOMAIN" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$CF_DOMAIN/" || echo "000")
            echo "HTTP status from https://$CF_DOMAIN/: $STATUS"
            [ "$STATUS" = "200" ] && echo "✅ Smoke test passed" || echo "⚠️ Unexpected status $STATUS (may still be propagating)"
          fi
        continue-on-error: true

      # ===== SUMMARY =====
      - name: 📊 Summary
        if: always()
        run: |
          ENV="${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}"
          {
            echo "## 🚀 Deploy: $ENV"
            echo "| | |"
            echo "|---|---|"
            echo "| **Branch** | ${{ github.ref_name }} |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Actor** | ${{ github.actor }} |"
            echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
