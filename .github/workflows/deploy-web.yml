name: Deploy Web App

on:
  push:
    branches:
      - prod       # → production (scaffald.com)
      - preview    # → preview (preview.scaffald.com)
      - main       # → dev (dev.scaffald.com)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, preview, production]

env:
  NODE_VERSION: "22"

# nrwl/nx-set-shas queries the workflow-runs API. The org default workflow token
# grants contents+packages only, so without an explicit `actions: read` this step
# fails "Resource not accessible by integration" and the whole deploy aborts.
permissions:
  contents: read
  actions: read

# Prevent concurrent deployments to the same environment
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Environment gate — production requires manual approval
    environment: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}

    steps:
      # ===== CHECKOUT =====
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      # ===== SETUP =====
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # ===== CACHE =====
      - name: 💾 Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: 💾 Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          # No `-${{ github.sha }}`: it made the primary key unhittable and wrote
          # a new entry every run, churning the 10 GB repo cache.
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # ===== INSTALL =====
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      # ===== BUILD WORKSPACE PACKAGES =====
      - name: 🏗️ Build workspace packages
        run: |
          pnpm nx run scf-core:build || true
          pnpm nx run scf-schemas:build

      # ===== QUALITY CHECKS (non-blocking) =====
      - name: 🔍 Quality checks
        run: |
          pnpm nx affected -t typecheck --base=origin/main --head=HEAD || true
          pnpm nx affected -t lint --base=origin/main --head=HEAD || true
        continue-on-error: true

      # ===== BUILD WEB APP =====
      - name: 🚀 Build web app
        working-directory: apps/scaffald
        env:
          NODE_ENV: production
          APP_ENV: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}
          # Supabase — prod uses main project, dev/preview use branches on the same project
          EXPO_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/prod' && secrets.EXPO_PUBLIC_SUPABASE_URL || github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_URL || secrets.DEV_EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/prod' && secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || github.ref == 'refs/heads/preview' && secrets.PREVIEW_EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.DEV_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # App URL
          EXPO_PUBLIC_URL: ${{ github.ref == 'refs/heads/prod' && 'https://scaffald.com' || github.ref == 'refs/heads/preview' && 'https://preview.scaffald.com' || 'https://dev.scaffald.com' }}
          # Google OAuth — shared across all environments (same GCP project)
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_SCHEME: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_SCHEME }}
          # Mapbox
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_MAPBOX_API_URL: ${{ secrets.EXPO_PUBLIC_MAPBOX_API_URL }}
          # PostHog
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          # Build flags
          EXPO_USE_FAST_REFRESH: "false"
        run: |
          echo "🏗️ Building for $APP_ENV..."
          pnpm web:build
          # web.output is 'server': the export is dist/client + dist/server and
          # there is no static index.html. Fail loudly if that ever changes
          # shape, rather than shipping something unservable.
          if [ ! -f dist/server/_expo/routes.json ]; then
            echo "❌ Expected an SSR export (dist/server/_expo/routes.json missing)."
            echo "   Check web.output in app.config.ts."
            exit 1
          fi
          echo "✅ Build complete ($(du -sh dist | cut -f1))"

      # ===== UPLOAD ARTIFACT =====
      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ github.sha }}
          path: apps/scaffald/dist/
          retention-days: 7

      # ===== DEPLOY EDGE FUNCTIONS =====
      # prod → main project, preview → preview branch, main → dev branch
      - name: 🔧 Deploy Edge Functions
        if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'
        working-directory: packages/supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ github.ref == 'refs/heads/prod' && secrets.SUPABASE_PROJECT_ID || github.ref == 'refs/heads/preview' && secrets.PREVIEW_SUPABASE_BRANCH_ID || secrets.DEV_SUPABASE_BRANCH_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "⏭️ Supabase secrets not configured — skipping edge functions"
            exit 0
          fi
          for func in api job-import news; do
            pnpx supabase functions deploy "$func" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --use-api \
              || echo "⚠️ $func deployment failed (non-blocking)"
          done
        continue-on-error: true

      # ===== CONFIGURE SUPABASE AUTH URLs =====
      - name: 🔐 Configure Supabase auth URLs
        if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ github.ref == 'refs/heads/prod' && secrets.SUPABASE_PROJECT_ID || github.ref == 'refs/heads/preview' && secrets.PREVIEW_SUPABASE_BRANCH_ID || secrets.DEV_SUPABASE_BRANCH_ID }}
          APP_URL: ${{ github.ref == 'refs/heads/prod' && 'https://scaffald.com' || github.ref == 'refs/heads/preview' && 'https://preview.scaffald.com' || 'https://dev.scaffald.com' }}
          # Production keeps the legacy app.scaffald.com origin authorised
          # alongside the apex: it 301s to the apex but old links, saved
          # bookmarks and stale OAuth entries still land there.
          EXTRA_ALLOWED: ${{ github.ref == 'refs/heads/prod' && 'https://app.scaffald.com,https://app.scaffald.com/auth/callback,https://www.scaffald.com,https://www.scaffald.com/auth/callback' || '' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "⏭️ Supabase secrets not configured — skipping auth URL config"
            exit 0
          fi
          ALLOW_LIST="$APP_URL,$APP_URL/auth/callback"
          if [ -n "$EXTRA_ALLOWED" ]; then
            ALLOW_LIST="$ALLOW_LIST,$EXTRA_ALLOWED"
          fi
          echo "🔐 Configuring auth URLs for $APP_URL..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$APP_URL\",\"uri_allow_list\":\"$ALLOW_LIST\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Auth URLs configured: site_url=$APP_URL"
          else
            echo "⚠️ Auth URL config failed (HTTP $HTTP_CODE): $BODY"
          fi
        continue-on-error: true

      # ===== DEPLOY TO EAS HOSTING =====
      # All environments run the SSR app on EAS Hosting. prod is promoted to the
      # production URL (fronted by CloudFront on the apex); dev/preview get
      # named aliases that dev.scaffald.com / preview.scaffald.com CNAME to.
      #
      # The old S3 + CloudFront sync was removed on 2026-07-28: since the switch
      # to web.output 'server' the export has no static index.html, so syncing
      # dist/ to a bucket produced an unservable site.
      - name: 🚀 Deploy to EAS Hosting
        working-directory: apps/scaffald
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DEPLOY_ALIAS: ${{ github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}
          # `--prod` and `--alias` control which URL the deployment is promoted
          # to. They do NOT select which EAS environment's variables are loaded
          # — that is `--environment`, and without it the worker starts with no
          # environment variables at all. Server-side config (RESEND_API_KEY)
          # then reads as undefined and the API routes fail at runtime while the
          # deploy itself reports success.
          DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'development' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ EXPO_TOKEN not configured — cannot deploy."
            exit 1
          fi
          if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            echo "🚀 Deploying to EAS production (scaffald.com), env: $DEPLOY_ENVIRONMENT"
            npx eas-cli@latest deploy --prod --environment "$DEPLOY_ENVIRONMENT" --non-interactive
          else
            echo "🚀 Deploying to EAS alias: $DEPLOY_ALIAS, env: $DEPLOY_ENVIRONMENT"
            npx eas-cli@latest deploy --alias "$DEPLOY_ALIAS" --environment "$DEPLOY_ENVIRONMENT" --non-interactive
          fi


      # ===== SMOKE TEST =====
      - name: 🧪 Smoke test
        if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ github.ref == 'refs/heads/prod' && 'https://scaffald.com' || github.ref == 'refs/heads/preview' && 'https://preview.scaffald.com' || 'https://dev.scaffald.com' }}
        run: |
          # Production is edge-cached and dev/preview CNAME straight to EAS, so
          # a new deploy is live within about a minute.
          echo "⏳ Waiting 30s for the deploy to become reachable..."
          sleep 30
          FAILED=0
          for path in / /privacy /robots.txt /sitemap.xml; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE_URL$path" || echo "000")
            echo "  $path -> $STATUS"
            [ "$STATUS" = "200" ] || FAILED=1
          done
          # SSR must actually render, not just return 200 with an empty shell.
          BODY=$(curl -s --max-time 30 "$SITE_URL/" || echo "")
          if ! echo "$BODY" | grep -q "<title>"; then
            echo "❌ No <title> in server output — generateMetadata is not running."
            FAILED=1
          fi
          if [ "$FAILED" = "1" ]; then
            echo "⚠️ Smoke test found problems (may still be propagating)."
          else
            echo "✅ Smoke test passed"
          fi
        continue-on-error: true

      # ===== SUMMARY =====
      - name: 📊 Summary
        if: always()
        run: |
          ENV="${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/preview' && 'preview' || 'dev' }}"
          {
            echo "## 🚀 Deploy: $ENV"
            echo "| | |"
            echo "|---|---|"
            echo "| **Branch** | ${{ github.ref_name }} |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Actor** | ${{ github.actor }} |"
            echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
