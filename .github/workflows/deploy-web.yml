name: Deploy Web App

on:
  push:
    branches:
      - main # Production deployments
      - staging # Staging deployments
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.17.1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ===== CHECKOUT =====
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better caching

      # ===== SETUP PNPM =====
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      # ===== SETUP NODE =====
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # ===== CACHE DEPENDENCIES =====
      - name: 💾 Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
            apps/expo/.expo
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ===== INSTALL DEPENDENCIES =====
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # ===== BUILD PACKAGES =====
      - name: 🏗️ Build workspace packages
        run: |
          echo "Building UI package..."
          pnpm --filter @app/ui build
          echo "Building Core package..."
          pnpm --filter @app/core build
          echo "Building Schemas package..."
          pnpm --filter @app/schemas build

      # ===== RUN QUALITY CHECKS =====
      - name: 🔍 Run quality checks
        run: |
          pnpm typecheck
          pnpm lint
        continue-on-error: true # Don't fail deploy on lint warnings

      # ===== BUILD WEB APP =====
      - name: 🚀 Build web application
        working-directory: apps/expo
        env:
          NODE_ENV: production
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          # Supabase
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # App URL
          EXPO_PUBLIC_URL: ${{ secrets.EXPO_PUBLIC_URL }}
          # Google OAuth
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_SCHEME: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_SCHEME }}
          # Mapbox
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_MAPBOX_API_URL: ${{ secrets.EXPO_PUBLIC_MAPBOX_API_URL }}
          # Build optimizations
          EXPO_USE_FAST_REFRESH: false
          TAMAGUI_DISABLE_WARN_DYNAMIC_LOAD: 1
        run: |
          echo "🏗️ Building web app for $APP_ENV..."
          pnpm web:build
          echo "✅ Build complete!"
          ls -lah dist/

      # ===== CREATE _redirects FILE =====
      - name: 📝 Create redirects file
        working-directory: apps/expo
        run: |
          echo "Creating _redirects for SPA routing..."
          echo "/* /index.html 200" > dist/_redirects
          cat dist/_redirects

      # ===== UPLOAD ARTIFACT =====
      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: apps/expo/dist/
          retention-days: 7

      # ===== DEPLOY EDGE FUNCTIONS (Production Only) =====
      - name: 🔧 Deploy Edge Functions to Supabase
        if: github.ref == 'refs/heads/main'
        working-directory: packages/supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Deploying Edge Functions to production..."
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            pnpx supabase functions deploy trpc --project-ref $SUPABASE_PROJECT_ID || echo "⚠️ tRPC deployment skipped"
            pnpx supabase functions deploy job-import --project-ref $SUPABASE_PROJECT_ID || echo "⚠️ job-import deployment skipped"
            pnpx supabase functions deploy news --project-ref $SUPABASE_PROJECT_ID || echo "⚠️ news deployment skipped"
            echo "✅ Edge Functions deployed"
          else
            echo "⏭️ Skipping Edge Functions deployment (secrets not configured)"
          fi
        continue-on-error: true

      # ===== DEPLOY TO NETLIFY =====
      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: "./apps/expo/dist"
          production-branch: main
          production-deploy: ${{ github.ref == 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            Deploy from commit ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      # ===== BUILD SUMMARY =====
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date)" >> $GITHUB_STEP_SUMMARY
