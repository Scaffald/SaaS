catalog:
  '@babel/core': ~7.29.0
  '@babel/runtime': ~7.29.7
  # Held at 2.4.x. 2.5.x turns on lint/correctness/noUnsafeOptionalChaining,
  # which errors (not warns) at two sites where a type assertion defeats an
  # otherwise-real null guard: packages/supabase completion.router.ts:513 and
  # packages/ui useFilePicker.ts:42. The second is in the ui submodule, so the
  # bump needs a cross-repo PR + pointer bump first. See #510.
  '@biomejs/biome': ~2.4.9
  '@expo/metro-runtime': ~56.0.12
  '@hookform/resolvers': ~5.5.7
  '@react-native-async-storage/async-storage': 2.2.0
  '@react-native-community/netinfo': 12.0.1
  '@react-native-google-signin/google-signin': ~16.1.2
  # Held at 10.1.x deliberately. 10.3.x pulls MapboxCommon 24.x, which Mapbox
  # serves only from its gated downloads API and needs a SECRET (sk.) token with
  # DOWNLOADS:READ. RNMapboxMapsDownloadToken in app.config.ts falls back to the
  # public EXPO_PUBLIC_MAPBOX_TOKEN (pk.), which 403s, and MAPBOX_DOWNLOADS_TOKEN
  # is set in no env file and in no EAS environment. Bumping this breaks the iOS
  # build at `pod install`. See #509 — provision the token first.
  '@rnmapbox/maps': ~10.1.45
  # Pinned at 2.86, in lockstep with the pnpm override of the same name (an
  # override outranks this entry — #453; lint:overrides now enforces the pair).
  # The BUILD-TIME blocker that froze this pin is fixed: the client is
  # lazy-initialized (scf-core/utils/supabase/client.ts) and the EAS builder
  # runs Node 22, both proven against 2.110.9 with the export:embed harness in
  # #512. What remains before bumping is RUNTIME validation of the 2.86→2.110
  # auth/realtime surface in the app itself — do that in its own PR.
  '@supabase/supabase-js': ~2.112.3
  '@tanstack/react-query': 5.90.21
  '@tanstack/react-table': ~8.21.3
