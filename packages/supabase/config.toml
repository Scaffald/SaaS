# A string used to distinguish different Supabase projects on the same host. Defaults to the working
# directory name when running `supabase init`.
project_id = "scaffald"

[api]
port = 54321
schemas = ["auth", "public", "core", "cms", "storage", "data", "onet"]
extra_search_path = ["public", "core", "cms", "data", "onet"]
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.seed]
enabled = true
sql_paths = ['./seeds/*.sql']

[studio]
# Port to use for Supabase Studio.
port = 54323

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
# Mailpit is enabled when:
# 1. NODE_ENV=development (magic link / email testing)
# 2. Tests are running (any app)
# 3. Scaffald app is running (always uses magic links)
[inbucket]
# Enable/disable Mailpit. Set via ENABLE_MAILPIT environment variable
# Defaults to enabled for backward compatibility, but should be controlled by startup script
enabled = true
# Port to use for the email testing server web interface.
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
# For local development, use http://localhost:5173 (Forsured web) or http://127.0.0.1:8081 (Scaffald Expo)
# Set to http://localhost:5173 for Forsured web app
site_url = "http://localhost:5173"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# Include both Forsured web (5173) and Scaffald Expo (8081) ports
# Also include callback paths for magic links
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:8081",
  "http://127.0.0.1:8081/auth/callback",
  "http://localhost:8081",
  "http://localhost:8081/auth/callback",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 seconds (one
# week).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.

[auth.external.google]
enabled = true

client_id = "env(EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
# Overrides the default auth redirectUrl.
redirect_uri = "env(EXPO_PUBLIC_SUPABASE_REDIRECT_URI)"

# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""

skip_nonce_check = true

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"
# Overrides the default auth redirectUrl.
redirect_uri = "env(EXPO_PUBLIC_SUPABASE_REDIRECT_URI)"
# Overrides the default auth provider URL.
url = ""
skip_nonce_check = true


[analytics]
enabled = true
port = 54327
vector_port = 54328
# Setup BigQuery project to enable log viewer on local development stack.
# See: https://logflare.app/guides/bigquery-setup
gcp_project_id = ""
gcp_project_number = ""
gcp_jwt_path = "supabase/gcloud.json"

# Disable runtime JWT verification for all Edge Functions so we can use the new
# JWT Signing Keys (ES256). The runtime would otherwise pass Uint8Array where
# jose expects CryptoKey (supabase/edge-runtime#654). Each function that needs
# auth must verify the token in code (e.g. supabase.auth.getUser(token)).
[functions.api]
verify_jwt = false
[functions.auth-logout]
verify_jwt = false
[functions.auth-refresh]
verify_jwt = false
[functions.auth-session]
verify_jwt = false
[functions.auth-token-exchange]
verify_jwt = false
[functions.background-check-webhook]
verify_jwt = false
[functions.ccpa-deadline-check]
verify_jwt = false
[functions.email-inbound-parse]
verify_jwt = false
[functions.feedback-sync-retry]
verify_jwt = false
[functions.feedback-to-braingrid]
verify_jwt = false
[functions.inbound-conversation-email]
verify_jwt = false
[functions.job-import]
verify_jwt = false
[functions.news]
verify_jwt = false
[functions.news-import]
verify_jwt = false
[functions.notify-background-check-expiration]
verify_jwt = false
[functions.notify-check-receipts]
verify_jwt = false
[functions.notify-digest-daily]
verify_jwt = false
[functions.notify-digest-weekly]
verify_jwt = false
[functions.notify-id-verification-expiration]
verify_jwt = false
[functions.notify-publish]
verify_jwt = false
[functions.notify-send-worker]
verify_jwt = false
[functions.persona-webhook]
verify_jwt = false
[functions.send-team-invitation]
verify_jwt = false
[functions.stripe-webhook]
verify_jwt = false
[functions.trpc]
verify_jwt = false
