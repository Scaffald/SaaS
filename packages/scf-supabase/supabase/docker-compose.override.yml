# Docker Compose Override for GoTrue Environment Variables
# This file overrides the default GOTRUE_SITE_URL and GOTRUE_URI_ALLOW_LIST
# to ensure magic links use the correct redirect URLs
#
# Supabase CLI will automatically merge this with the generated docker-compose.yml
# See: https://docs.docker.com/compose/extends/

version: '3.8'

services:
  auth:
    environment:
      # Override site URL to match config.toml
      # This ensures magic links use http://localhost:5173 instead of http://127.0.0.1:3000
      GOTRUE_SITE_URL: "http://localhost:5173"
      # Allow list of redirect URLs - must include all URLs used in emailRedirectTo
      GOTRUE_URI_ALLOW_LIST: "http://localhost:5173,http://localhost:5173/auth/callback,http://127.0.0.1:5173,http://127.0.0.1:5173/auth/callback,http://127.0.0.1:8081"

